
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de libro</title>

    <link rel="stylesheet" href="../static/css/estilos.css" th:href="@{/css/estilos.css}">
</head>

<body>

<div th:replace="~{fragments/menu :: menu}"></div>

<main>
    <h1 th:text="${libro.id == null} ? 'Añadir libro' : 'Editar libro'">
        Formulario de libro
    </h1>

    <form class="formulario-libro"
          th:action="@{/libros/guardar}"
          th:object="${libro}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <label for="titulo">Título</label>
        <input type="text" id="titulo" th:field="*{titulo}" required>

        <label for="autor">Autor</label>
        <input type="text" id="autor" th:field="*{autor}" required>

        <label for="isbn">ISBN</label>
        <input type="text" id="isbn" th:field="*{isbn}" required>

        <label for="anioPublicacion">Año de publicación</label>
        <input type="number" id="anioPublicacion"
               th:field="*{anioPublicacion}" min="1" required>

        <div class="botones-formulario">
            <button type="submit" class="boton-guardar">Guardar</button>
            <a class="boton-cancelar" th:href="@{/libros}">Cancelar</a>
        </div>

    </form>
</main>

</body>
</html>
