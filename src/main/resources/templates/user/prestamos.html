<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis préstamos - Biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" th:href="@{/css/zona-usuario.css}">
</head>
<body>

<div th:replace="~{fragments/menu :: menu}"></div>

<main>
    <h1>Mis préstamos</h1>

    <p>Consulta los préstamos registrados en la biblioteca.</p>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Libro</th>
                <th>Fecha de préstamo</th>
                <th>Fecha de devolución</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="prestamo : ${prestamos}">
                <td th:text="${prestamo.id}"></td>
                <td th:text="${prestamo.libro != null ? prestamo.libro.titulo : 'Sin libro'}"></td>
                <td th:text="${prestamo.fechaPrestamo}"></td>
                <td th:text="${prestamo.fechaDevolucion}"></td>
            </tr>
        </tbody>
    </table>

    <div class="contenedor-boton">
        <a th:href="@{/user/inicio}" class="boton-anadir">
            Volver al inicio
        </a>
    </div>
</main>

</body>
</html>
