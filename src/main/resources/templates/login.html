
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Biblioteca</title>
    <link rel="stylesheet" href="../static/css/estilos.css" th:href="@{/css/estilos.css}">
</head>
<body>

<main>
    <h1>Iniciar sesión</h1>

    <p th:if="${param.error}" style="color: #DC3545;">
        Correo electrónico o contraseña incorrectos.
    </p>

    <p th:if="${param.logout}" style="color: #198754;">
        Has cerrado sesión correctamente.
    </p>

    <form th:action="@{/login}" method="post" class="formulario-libro">

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email"
               autocomplete="username" required>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" required>

        <div class="botones-formulario">
            <button type="submit" class="boton-guardar">
                Iniciar sesión
            </button>
        </div>

    </form>

    <p>
        ¿No tienes una cuenta?
        <a th:href="@{/registro}">Regístrate aquí</a>
    </p>
</main>

</body>
</html>
