<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Préstamos - Biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:replace="~{fragments/menu :: menu}"></div>

<main>

    <h1>Gestión de préstamos</h1>

    <h2>Listado de préstamos</h2>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Usuario</th>
            <th>ID del libro</th>
            <th>Fecha de préstamo</th>
            <th>Fecha de devolución</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="prestamo : ${prestamos}">
            <td th:text="${prestamo.id}"></td>
            <td th:text="${prestamo.usuario.nombre}"></td>
            <td th:text="${prestamo.libro.id}"></td>
            <td th:text="${prestamo.fechaPrestamo}"></td>
            <td th:text="${prestamo.fechaDevolucion != null ? prestamo.fechaDevolucion : 'Pendiente'}"></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
